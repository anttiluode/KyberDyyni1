name: control-law-fork

on:
  workflow_dispatch:

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Re-run final attacker fork
        run: python experiments/fork_mode_switch_attack.py
