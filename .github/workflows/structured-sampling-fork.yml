name: structured-sampling-fork

on:
  push:
    branches: [structured-sampling-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-structured-sampling-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run phase x sweep-direction delayed-credit fork
        run: python experiments/fork_phase_direction_address.py
