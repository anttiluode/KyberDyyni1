name: rank-scaling-sign-fork

on:
  push:
    branches: [rank-scaling-sign-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-rank-scaling-sign-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q experiments
      - name: Run rank scaling sign attack
        run: python experiments/fork_rank_scaling_sign.py
