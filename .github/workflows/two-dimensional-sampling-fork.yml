name: two-dimensional-sampling-fork

on:
  push:
    branches: [two-dimensional-sampling-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-2d-sampling-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run 2-D geometry bakeoff
        run: python experiments/fork_2d_sampling_geometry.py
