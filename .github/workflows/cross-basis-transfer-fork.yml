name: cross-basis-transfer-fork

on:
  push:
    branches: [cross-basis-transfer-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-cross-basis-transfer-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q experiments
      - name: Run cross-basis transfer attack
        run: python experiments/fork_cross_basis_transfer.py
