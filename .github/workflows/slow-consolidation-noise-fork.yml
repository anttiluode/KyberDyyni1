name: slow-consolidation-noise-fork

on:
  push:
    branches: [slow-consolidation-noise-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-slow-consolidation-noise-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q experiments
      - name: Run slow consolidation noise attack
        run: python experiments/fork_slow_consolidation_noise.py
