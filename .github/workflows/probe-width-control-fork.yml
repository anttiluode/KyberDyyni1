name: probe-width-control-fork

on:
  push:
    branches: [probe-width-control-fork]
  workflow_dispatch:

concurrency:
  group: kyberdyyni-probe-width-control-fork
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run probe-width control attack
        run: python experiments/fork_probe_width_control.py
